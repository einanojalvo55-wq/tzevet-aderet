# כל שינוי שנשמר ב-GitHub עולה אוטומטית לאוויר:
# הכתובת הראשית: tzevet-aderet.web.app (Firebase Hosting, חינם)
# גיבוי: GitHub Pages
name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - name: Deploy to tzevet-aderet.web.app
        if: env.SA != ''
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14.9.0 deploy --only hosting --project tzevet-aderet --non-interactive
      - name: Push to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
